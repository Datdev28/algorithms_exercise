<body>
  <script>
class Queue {
  constructor() {
    this.items = {};
    this.rear = 0;
  }

  enqueue(element) {
    this.rear++;
    this.items[this.rear] = element; // ← đúng tên là this.items
  }
  dequeue(){
    delete this.items[this.rear];
  }
}

const queue = new Queue();
queue.enqueue(3);  // không cần log, vì enqueue không return gì
queue.enqueue(3);  // không cần log, vì enqueue không return gì
queue.enqueue(3);
queue.dequeue()  // không cần log, vì enqueue không return gì
console.log(queue); // xem trạng thái hàng đợi

</script>
</body>
