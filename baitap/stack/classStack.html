<body>
  <script>
  class Stack {
    c = 6;
   constructor(){
    this.stack = []
   }
   push(value){
    this.stack.push(value);
   }
   pop(){
    this.stack.pop();
   }
   top(){
    return this.stack[this.stack.length - 1]
   }
   getMin(){
    let minNumber = this.stack[0]
    for(let item of this.stack){
      minNumber = Math.min(item, minNumber);
    }
    return minNumber 
   }
  }
  const a = new Stack();
  a.push(1);
  a.push(2);
  a.push(3);
  a.push(-4);
  a.push(9);
  a.top();
  a.pop();
  console.log(a);
  console.log(a.getMin());
  </script>
