<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const evalRPN = (arr) => {
      const stack = [];
      let result = 0;
      const operator = new Set(["+", "-", "*", "/"])
      for (let item of arr) {
        if (operator.has(item)) {
            if (stack.length < 2) {
            throw new Error("Lỗi")
          }
          const b = stack.pop();
          const a = stack.pop();
          switch (item) {
            case "+":
              result = a + b;
              break;
            case "-":
              result = a - b;
              break;
            case "*": ;
              result = a * b;
              break;
            case "/":
              if (b === 0) {
                throw new Error("Lỗi phép tính");
              }
              result = Math.floor(a / b);
              break;
          }
          stack.push(result);
        }else {
          stack.push(Number(item))
        }
      }
      if (stack.length !== 1) {
        throw new Error("Biểu thức lỗi");
      }
      return stack.pop();
    }
    console.log(evalRPN(["2", "1", "+", "3", "*"]));
    console.log(evalRPN(["4", "13", "5", "/", "+"]));
  </script>
</body>

</html>
