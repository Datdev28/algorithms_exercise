const twoSum = function(nums, target){
  let map = new Map();
  for(let i = 0; i < nums.length; i++){ 
   let element = target - nums[i];
   if(map.has(element)){
    return [map.get(element), i]
   }
   map.set(nums[i], i)
  }
  return -1;
}
  console.log(twoSum([3,2,4], 6))
