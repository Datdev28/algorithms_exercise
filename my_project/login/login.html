<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="icons/fontawesome-free-6.5.2-web/css/all.min.css">
</head>

<body>
  <div>
    <div class="container">
      <p class="title">Login</p>
      <div class="input">
        <p class="suggest">User name:</p>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" class="account js-account">
        </div>
        <p class="suggest">Password:</p>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" class="password js-password">
        </div>
      </div>
      <div class="operation">
        <button class="js-login login">Login</button>
        <p class="register">Register </p>
      </div>
    </div>
  </div>
</body>
<script src="login.js"></script>

</html>
