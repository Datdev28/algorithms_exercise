<body>
<script>
function findMax(arr){
  return resolve(arr, arr.length - 1, arr[0]);
}
function resolve(arr, n, max){
  if(n <= 0){
    return max
  }else {
    if(arr[n] > max){
      max = arr[n];
    }
  }
  return resolve(arr, n - 1, max);
}
console.log(findMax([9, 3, 2, 5, 4, 12]))
</script>
</body>
