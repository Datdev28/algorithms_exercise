<body>
<script>
function isPalindrome(string){
  return resolve(string, 0 ,string.length - 1)
}
function resolve(string, index, n){
  if(n <= index){
    return true
  }else {
    if(string[index] === string[n]){
      return resolve(string, index + 1, n - 1)
    }else {
      return false
    }
  }
}
console.log(isPalindrome("racecar"))
</script>
</body>
