<body>
<script>
  function sumArray(arr){
   return sum(arr, arr.length - 1)
  }
  function sum(arr, n){
   if(n === 0){
    return arr[0]
   }else {
    return arr[n] + sum(arr, n - 1);
   }
  }
 console.log(sumArray([1, 2, 3, 4, 5, 9, 2, -2, 4]));
