<body>
<script>
function reverseString(string){
  return reverse(string, string.length - 1)
}

function reverse(string, n){
  if(n < 0){
    return ""
  }else {
    return string[n] + reverse(string, n - 1);
  }
}

console.log(reverseString("hello"));
</script>
