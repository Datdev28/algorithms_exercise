<body>
<script>
let arr = [-5, 2, 10, 4, 6];
function findindex(t){
  for(let i = 0; i < arr.length; i++){
  if(arr[i] === t){
    return i
  }
}
  return -1
}
console.log(findindex(10))
//big O(n)
</script>
