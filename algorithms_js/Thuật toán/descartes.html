function descartes(arr1, arr2){
  let newArray = []
  return resolve(arr1, arr2, arr1.length - 1, newArray);
}
function resolve(arr1, arr2, n, newArray){
  if(n < 0){
    return newArray
  }
  for(let i = 0; i < arr2.length; i++){
    let arrChild = [];
      arrChild.push(arr1[n]);
      arrChild.push(arr2[i]);
      newArray.push(arrChild)
  }
  return resolve(arr1, arr2, n - 1, newArray)
}
console.log(descartes([1, 2, 3], ["a", "b"]));
