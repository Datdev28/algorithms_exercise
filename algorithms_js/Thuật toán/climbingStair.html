 // đệ quy không tối ưu cho cách này
 function climbing(n) {
  let arrWay = [1, 2];
  return resolve(n, arrWay);
}

function resolve(n, arrWay) {
  if (n <= 2) {
    return arrWay[n - 1];
  }
  arrWay[n] = resolve(n - 1, arrWay) + resolve(n - 2, arrWay);
  return arrWay[n];
}

console.log(climbing(6)); // Kết quả mong đợi: 3
