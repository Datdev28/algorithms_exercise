<script>

  function insertionSort(arr){
    let temp;
    let INT;
    outer: for(let i = 1; i < arr.length; i++){
       INT = arr[i];
       console.log("Lần lặp i", i)
      for(let j = i - 1; j >= 0; j--){
        console.log("Lần lặp j: ",j)
        if(arr[j] > INT){
          arr[j + 1] = arr[j];
        }else {
          arr[j + 1] = INT;
          continue outer;
        }
      }
     arr[0] = INT
    }
    return arr;
  }


  let arr = [-6, 20, 8, -8, 4, 7, 3, 2, 19, 22, -12]
  console.log(insertionSort(arr))
</script>
